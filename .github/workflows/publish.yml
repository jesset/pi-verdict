# 发布触发:GitHub Release 发布(published)或手动 workflow_dispatch(输入 tag)。
# 借鉴 czottmann/pi-automode 的 publish 设计:双验证 + npm@11 trusted publishing。
# 一次性配置(npmjs.com → pi-verdict → Settings → Trusted Publisher):
#   Repository: jesset/pi-verdict / Workflow: publish.yml / Environment: 留空

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # npm OIDC provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version=$(bun -e 'console.log(require("./package.json").version)')
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::release tag ($RELEASE_TAG) != package.json version ($expected_tag)"
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::checked-out commit ($head_commit) != tag $RELEASE_TAG ($tag_commit)"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck + tests)
        run: |
          bun run typecheck
          bun test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use npm with trusted publishing support
        run: npm install --global npm@11

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish
        run: npm publish --provenance --access public

# trigger re-registration: touch v2
